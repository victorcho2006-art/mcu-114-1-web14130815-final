<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>卓定騰個人網站</title>
    <link rel="stylesheet" href="style.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
  </head>
  <body>
    <section>
        <nav id="header">
          <div class="nav-name">
            <p>Portfolio</p>
          </div>
          <div class="nav_list">
            <a href="#home" class="nav-link active-line">首頁</a>
            <a href="#about" class="nav-link">關於我</a>
            <a href="#skill" class="nav-link">技術</a>
            <a href="#contact" class="nav-link">作品集</a>
          </div>
          <div class="nav-button">
            <button class="btn">下載履歷 <i class="fa-regular fa-file-pdf"></i></button>
          </div>
        </nav>
      <main class="wrapper">
        <section class="home-box" id="home">
          <div class="home-text">
            <div class="home-text-card">
              <span>卓定騰</span>
            </div>
            <div class="home-name">
              <p>銘傳大一生</p>
            </div>
            <div class="home-text-info">
              <p1>剛準備結束大一上學期的課程，並對程設多了許多了解。</p1>
            </div>
            <div class="home-text-btn">
              <button class="btn blue-btn">Hire Me</button>
              <button class="btn">下載履歷 <i class="fa-regular fa-file-pdf"></i></button>
            </div>
            <div class="social-icons">
              <div class="icon"><i class="fa-brands fa-instagram"></i></div>
              <div class="icon"><i class="fa-brands fa-linkedin"></i></div>
              <div class="icon"><i class="fa-brands fa-facebook"></i></div>
              <div class="icon"><i class="fa-brands fa-github"></i></div>
            </div>

          </div>
          <div class="home-image">
            <img src="../assets/PNG.png" alt="avatar" />
        </section>
      </main>
      <footer>
        <div class="footer-social-icons">
          <div class="icon"><i class="fa-brands fa-instagram"></i></div>
          <div class="icon"><i class="fa-brands fa-linkedin"></i></div>
          <div class="icon"><i class="fa-brands fa-facebook"></i></div>
          <div class="icon"><i class="fa-brands fa-github"></i></div>
        </div>
      </footer>
    </section>
    <script src="./main.js"></script>
  </body>
</html>
